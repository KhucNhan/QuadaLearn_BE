management.endpoints.web.exposure.include=*

# === SERVER PORT (n?u c?n ??i c?ng) ===
server.port=8888
spring.application.name=QuadaLearn

# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/quadaLearn?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
